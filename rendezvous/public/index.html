<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Share your screen</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#ffffff; --fg:#14181d; --muted:#5b646e; --line:#d6dbe1;
    --field:#f6f7f9; --accent:#0b57d0; --ok:#1a7f37; --err:#b3261e;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e1116; --fg:#e6edf3; --muted:#9aa4af; --line:#2a313c;
          --field:#161b22; --accent:#7aa7ff; --ok:#3fb950; --err:#ff7b72}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none !important}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px}
  h1{font-size:22px;margin:0}
  p.sub{margin:0;color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .code-input{width:100%;font:600 34px/1.2 var(--mono);letter-spacing:.14em;text-align:center;
       text-transform:uppercase;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--fg)}
  button{font:600 16px/1 inherit;padding:14px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;width:100%}
  button.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--field)}
  .saved{display:flex;flex-direction:column;gap:8px}
  .saved .item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
  .saved .item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .saved .item .code{font:600 13px var(--mono);color:var(--muted)}
  .iconbtn{width:auto;padding:8px 10px;background:transparent;color:var(--muted);border:1px solid var(--line);font-size:13px}
  .status{display:flex;align-items:center;gap:10px;font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.wait{background:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .err{color:var(--err)}
  .preview{width:100%;border-radius:12px;border:1px solid var(--line);background:#000;aspect-ratio:16/9;object-fit:contain}
  .hint{font-size:13px;color:var(--muted)}
  .stat{font:12px/1.4 var(--mono);color:var(--muted);white-space:pre-wrap}
  select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
</style>
</head>
<body>

<div class="wrap" id="screen-join">
  <div>
    <h1>Share your screen</h1>
    <p class="sub">Type the code from your friend's OOI window, then choose what to share.</p>
  </div>

  <div>
    <label for="code">Connection code</label>
    <input id="code" class="code-input" inputmode="latin" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="ABC-DEF" maxlength="7" aria-describedby="join-msg">
  </div>

  <div class="row">
    <label class="hint" style="flex:1;margin:0">Quality
      <select id="fps" aria-label="frame rate">
        <option value="8" selected>8 fps · sharpest (recommended)</option>
        <option value="5">5 fps · lowest bandwidth</option>
        <option value="10">10 fps · smoother</option>
        <option value="15">15 fps · fast connections</option>
      </select>
    </label>
  </div>

  <button id="connect" disabled>Choose what to share</button>
  <div class="status" id="join-status" hidden><span class="dot wait"></span><span id="join-msg"></span></div>

  <div id="saved-wrap" hidden>
    <label>Reconnect to</label>
    <div class="saved" id="saved"></div>
  </div>

  <p class="hint">Your screen goes straight to your friend's computer, encrypted end to end. This site only helps you connect and never sees your screen.</p>
  <p class="err" id="compat" hidden></p>
</div>

<div class="wrap" id="screen-watch" hidden>
  <div class="status"><span class="dot" id="watch-dot"></span><strong id="watch-title">Connecting…</strong></div>
  <video class="preview" id="preview" autoplay muted playsinline></video>
  <p class="hint" id="watch-detail">You can minimise this tab; sharing continues.</p>
  <div class="card"><div class="stat" id="stats">—</div></div>
  <button class="secondary" id="stop">Stop sharing</button>
</div>

<script>
"use strict";
// ---- mount + endpoints ----------------------------------------------------
// The app is served under /ooi (a Worker route). base-uri is locked to 'none',
// so a <base> tag is not allowed; the mount is computed instead.
const MOUNT = location.pathname.startsWith('/ooi') ? '/ooi' : '';
const api = p => MOUNT + p;

// ---- join code ------------------------------------------------------------
const ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const normalizeCode = s => (s||'').toUpperCase().split('').filter(c=>ALPHABET.includes(c)).join('');
const prettyCode = c => c.length>3 ? c.slice(0,3)+'-'+c.slice(3) : c;
async function roomIdFor(code){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function newSession(){
  return [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ---- sealed blob (OOI1), byte-compatible with the native host -------------
const PREFIX='OOI1:', MAGIC=[0x4f,0x4f,0x49,0x31], FLAG_ENC=1, SALT=16, IV=12, TAG=16, ITER=200000;
const b64u = b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u = t=>{const n=t.replace(/-/g,'+').replace(/_/g,'/');const b=atob(n+'='.repeat((4-n.length%4)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const pipe = (t,b)=>new Response(new Blob([b]).stream().pipeThrough(t)).arrayBuffer().then(a=>new Uint8Array(a));
const cat = (...p)=>{const o=new Uint8Array(p.reduce((a,x)=>a+x.length,0));let k=0;for(const x of p){o.set(x,k);k+=x.length}return o};
async function derive(pass,salt){
  const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'}, m, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}
async function sealBlob(sdp, code){
  const body = await pipe(new CompressionStream('deflate-raw'), new TextEncoder().encode(sdp));
  const salt = crypto.getRandomValues(new Uint8Array(SALT)), iv = crypto.getRandomValues(new Uint8Array(IV));
  const head = cat(new Uint8Array(MAGIC), new Uint8Array([FLAG_ENC]), salt, iv);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:head,tagLength:TAG*8}, await derive(code,salt), body));
  return PREFIX + b64u(cat(head, ct));
}
async function openBlob(blob, code){
  const raw = unb64u(blob.trim().slice(PREFIX.length));
  if (raw.length<5 || MAGIC.some((m,i)=>raw[i]!==m)) throw new Error('not a blob');
  const hl = 5+SALT+IV, head = raw.subarray(0,hl);
  let pt;
  try{
    pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.subarray(5+SALT,hl),additionalData:head,tagLength:TAG*8},
      await derive(code, raw.subarray(5,5+SALT)), raw.subarray(hl));
  }catch{ throw new Error('wrong code'); }
  return new TextDecoder().decode(await pipe(new DecompressionStream('deflate-raw'), new Uint8Array(pt)));
}

// ---- saved codes ----------------------------------------------------------
const STORE='ooi.hosts';
const loadSaved = ()=>{try{const v=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(v)?v.filter(e=>e&&typeof e.code==='string'):[]}catch{return[]}};
const putSaved = l=>{try{localStorage.setItem(STORE,JSON.stringify(l.slice(0,12)))}catch{}};
const findSaved = code=>loadSaved().find(e=>e.code===code);
function rememberHost(code,name){
  const list = loadSaved().filter(e=>e.code!==code);
  list.unshift({code,name:(name||findSaved(code)?.name||'').trim(),at:Date.now()});
  putSaved(list);
  renderSaved();
}
// Per-tab memory (the relay flag): storage can be unavailable, never fatal.
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch{return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}};
const ssDel=k=>{try{sessionStorage.removeItem(k)}catch{}};
function forgetHost(code){ putSaved(loadSaved().filter(e=>e.code!==code)); renderSaved(); }

// ---- DOM ------------------------------------------------------------------
const $ = id=>document.getElementById(id);
const elCode=$('code'), elConnect=$('connect'), elJoinStatus=$('join-status'), elJoinMsg=$('join-msg');
const elSavedWrap=$('saved-wrap'), elSaved=$('saved'), elFps=$('fps'), elCompat=$('compat');
const elWatch=$('screen-watch'), elJoin=$('screen-join'), elPreview=$('preview');
const elWatchTitle=$('watch-title'), elWatchDetail=$('watch-detail'), elWatchDot=$('watch-dot'), elStats=$('stats'), elStop=$('stop');

function showJoin(msg,isErr){
  elWatch.hidden=true; elJoin.hidden=false;
  if(msg){ elJoinStatus.hidden=false; elJoinMsg.textContent=msg; elJoinMsg.className=isErr?'err':''; }
  else elJoinStatus.hidden=true;
  elConnect.disabled = normalizeCode(elCode.value).length!==6;
}
function joinStatus(msg,kind){
  elJoinStatus.hidden=false; elJoinMsg.textContent=msg; elJoinMsg.className='';
  const dot=elJoinStatus.querySelector('.dot'); dot.className='dot '+(kind||'wait');
}
function showWatch(){ elJoin.hidden=true; elWatch.hidden=false; }
function watchStatus(title,detail,kind){
  elWatchTitle.textContent=title;
  if(detail!=null) elWatchDetail.textContent=detail;
  elWatchDot.className='dot '+(kind||'wait');
}

elCode.addEventListener('input',()=>{
  const n=normalizeCode(elCode.value).slice(0,6);
  elCode.value=prettyCode(n);
  elConnect.disabled=n.length!==6;
});
elCode.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!elConnect.disabled) start(normalizeCode(elCode.value)); });
elConnect.addEventListener('click',()=>start(normalizeCode(elCode.value)));
elStop.addEventListener('click',()=>{ stop(); showJoin(); });

function renderSaved(){
  const list=loadSaved();
  elSavedWrap.hidden=list.length===0;
  elSaved.innerHTML='';
  for(const e of list){
    const item=document.createElement('div'); item.className='item';
    const b=document.createElement('button'); b.className='iconbtn'; b.style.flex='1'; b.style.textAlign='left';
    b.innerHTML=`<span class="name">${escapeHtml(e.name||prettyCode(e.code))}</span> <span class="code">${prettyCode(e.code)}</span>`;
    b.onclick=()=>{ elCode.value=prettyCode(e.code); elConnect.disabled=false; start(e.code); };
    const ren=document.createElement('button'); ren.className='iconbtn'; ren.textContent='Rename';
    ren.onclick=()=>{ const n=prompt('Name for this connection:',e.name||''); if(n!=null){ rememberHost(e.code,n); } };
    const del=document.createElement('button'); del.className='iconbtn'; del.textContent='Remove';
    del.onclick=()=>forgetHost(e.code);
    item.append(b,ren,del); elSaved.appendChild(item);
  }
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ---- connection driver (joiner = answerer) --------------------------------
const ICE = { iceServers:[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']}] };
const ATTEMPT_TIMEOUT=25000, GATHER_TIMEOUT=8000, SESSION_COOLDOWN=30000;
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
let generation=0, wakeLock=null, shareStream=null;

let picking=false;
async function start(code){
  code = normalizeCode(code);
  if(code.length!==6 || picking) return;
  // Capture the screen up front, once, so a reconnect reuses the same stream
  // and the user is not re-prompted on every host restart. One picker at a
  // time: a deep link starts by itself, and a click while its picker is open
  // must not start a second, competing connection.
  if(!shareStream){
    picking=true;
    try{
      shareStream = await navigator.mediaDevices.getDisplayMedia({
        video:{ frameRate:{ ideal:Number(elFps.value), max:Number(elFps.value) } },
        audio:false
      });
    }catch(e){ showJoin('Screen share was cancelled.',true); return; }
    finally{ picking=false; }
    // If the user stops sharing from the browser's own control, end cleanly.
    shareStream.getVideoTracks()[0].addEventListener('ended',()=>{ stop(); showJoin('Screen sharing ended.'); });
  }
  showWatch();
  const gen=++generation;
  driver(code, gen).catch(e=>{ if(gen===generation){ showJoin(e.message||'Connection failed.',true);} });
}
function stop(){
  generation++;
  if(shareStream){ shareStream.getTracks().forEach(t=>t.stop()); shareStream=null; }
  releaseWake();
}

async function getOffer(id){
  const r=await fetch(api(`/api/room/${id}`),{cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('server');
  return r.json();
}

async function driver(code, gen){
  const id=await roomIdFor(code);
  const known=Boolean(findSaved(code));
  const spent=new Map();
  let everConnected=false, waitingSince=Date.now(), failedInARow=0;
  // Once this tab has needed the relay for this host, go straight to it.
  const stickyKey='ooi.relay.'+code;
  let useRelay=ssGet(stickyKey)==='1', relayFails=0;

  while(gen===generation){
    let room;
    try{ room=await getOffer(id); }
    catch{ watchStatus('Waiting for the network…',null,'wait'); await sleep(2000); continue; }
    if(gen!==generation) return;

    if(!room){
      if(!everConnected && !known && Date.now()-waitingSince>15000){
        stop(); showJoin('Nobody is using that code. Check it and try again.',true); return;
      }
      watchStatus(known||everConnected?'Waiting for your friend to be ready…':'Looking for your friend…',
                  'Their OOI window must be running.','wait');
      await sleep(1500); continue;
    }
    const lost=spent.get(room.session);
    if(lost && Date.now()-lost<SESSION_COOLDOWN){ await sleep(1000); continue; }

    const hostRelays=(room.caps||[]).includes('relay');
    const canRelay=hostRelays && relaySupported();
    const viaRelay=useRelay && canRelay;
    const outcome=await (viaRelay?relayAttempt:attempt)(id, code, room, gen, ()=>{
      everConnected=true; rememberHost(code);
    });
    if(gen!==generation) return;
    if(outcome==='badcode'){ stop(); showJoin('That code is not right.',true); return; }
    const failed=outcome==='failed'||outcome==='timeout';
    failedInARow=failed?failedInARow+1:0;
    if(failed && !viaRelay && canRelay){
      // The two networks cannot reach each other directly: carry the stream
      // through the server instead, still end-to-end encrypted. The host is
      // still listening on this offer, so retry it at once.
      useRelay=true; relayFails=0;
      continue;
    }
    if(failed && viaRelay && ++relayFails>=2){ useRelay=false; relayFails=0; ssDel(stickyKey); }
    if(failedInARow>=2 && !hostRelays)
      watchStatus('Still trying…',"Your network can't reach your friend's computer directly. Ask them to update OOI (run: ooi update) so the stream can be relayed.",'err');
    else if(failedInARow>=2 && !relaySupported())
      watchStatus('Still trying…',"Your network can't reach your friend's computer directly, and this browser cannot use the relay. Use desktop Chrome or Edge.",'err');
    if(outcome!=='stale'){ spent.set(room.session,Date.now()); await sleep(500); }
    waitingSince=Date.now();
  }
}

async function attempt(id, code, room, gen, onLive){
  let offerSDP;
  try{ offerSDP=await openBlob(room.offer, code); }catch{ return 'badcode'; }

  const pc=new RTCPeerConnection(ICE);
  const done=deferred();
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='connected') watchStatus('Sharing your screen','Your friend can see this now. You can minimise the tab.','ok');
    if(s==='failed'||s==='closed') done.resolve('failed');
    if(s==='disconnected'){ watchStatus('Connection interrupted…','Trying to recover.','wait'); }
  };

  try{
    await pc.setRemoteDescription({type:'offer',sdp:offerSDP});
    // Attach the screen track to the recvonly transceiver the host offered.
    for(const track of shareStream.getVideoTracks()){
      track.contentHint='detail'; // screen content: preserve sharpness over motion
      pc.addTrack(track, shareStream);
    }
    await pc.setLocalDescription(await pc.createAnswer());
    tuneEncoding(pc, Number(elFps.value));
    await gatherComplete(pc, GATHER_TIMEOUT);
    if(gen!==generation){ pc.close(); return 'aborted'; }

    const answer=await sealBlob(pc.localDescription.sdp, code);
    const post=await fetch(api(`/api/room/${id}/answer`),{method:'POST',
      headers:{'content-type':'application/json'}, body:JSON.stringify({answer, session:room.session})});
    if(post.status===409){ pc.close(); return 'stale'; }
    if(!post.ok){ pc.close(); return 'failed'; }

    const timer=setTimeout(()=>done.resolve('timeout'), ATTEMPT_TIMEOUT);
    const posted=Date.now(), canRelay=(room.caps||[]).includes('relay') && relaySupported();
    const watch=setInterval(async()=>{
      if(pc.connectionState==='connected') return done.resolve('connected');
      // Seven seconds of connectivity checks without a single reply means the
      // two networks cannot reach each other: stop waiting, use the relay.
      if(canRelay && Date.now()-posted>7000){
        try{
          let sent=0, answered=0;
          (await pc.getStats()).forEach(r=>{ if(r.type==='candidate-pair'){ sent+=r.requestsSent||0; answered+=r.responsesReceived||0; } });
          if(pc.iceConnectionState!=='connected' && answered===0 && (sent>10 || Date.now()-posted>12000)){
            timing.directGaveUp=Date.now()-posted;
            done.resolve('failed');
          }
        }catch{}
      }
    },250);
    const supersede=setInterval(async()=>{
      try{ const now=await getOffer(id); if(!now||now.session!==room.session) done.resolve('stale'); }catch{}
    },2000);

    const why=await done.promise;
    clearTimeout(timer); clearInterval(watch); clearInterval(supersede);
    if(gen!==generation || why!=='connected'){ pc.close(); return why==='stale'?'stale':'failed'; }

    onLive();
    await requestWake();
    showPreview();
    startStats(pc);
    await new Promise(r=>{ pc.onconnectionstatechange=()=>['failed','disconnected','closed'].includes(pc.connectionState)&&r(); });
    stopStats(); pc.close();
    return 'connected';
  }catch(e){ try{pc.close()}catch{}; return 'failed'; }
}

// tuneEncoding is where quality on a slow link is decided.
function tuneEncoding(pc, fps){
  for(const sender of pc.getSenders()){
    if(!sender.track || sender.track.kind!=='video') continue;
    const p=sender.getParameters();
    if(!p.encodings || !p.encodings.length) p.encodings=[{}];
    // Preserve resolution/sharpness; shed frame rate first when bandwidth is
    // tight. This is the "keep a high-quality frame, drop fps" behaviour.
    p.degradationPreference='maintain-resolution';
    p.encodings[0].maxFramerate=fps;
    // A high ceiling the congestion controller is free to use when the link is
    // good, and to back away from automatically when it is not — so quality
    // rises on fast connections and holds together on slow ones.
    p.encodings[0].maxBitrate=8_000_000;
    p.encodings[0].scaleResolutionDownBy=1;
    sender.setParameters(p).catch(()=>{});
  }
}

function showPreview(){
  try{ elPreview.srcObject=shareStream; }catch{}
}

// ---- live stats -----------------------------------------------------------
let statsTimer=null;
function startStats(pc){
  stopStats();
  let lastBytes=0, lastTs=0;
  statsTimer=setInterval(async()=>{
    let line='';
    try{
      const rep=await pc.getStats();
      rep.forEach(s=>{
        if(s.type==='outbound-rtp' && s.kind==='video'){
          const now=s.timestamp, bytes=s.bytesSent||0;
          let kbps=0;
          if(lastTs) kbps=Math.round((bytes-lastBytes)*8/(now-lastTs));
          lastBytes=bytes; lastTs=now;
          const w=s.frameWidth||0, h=s.frameHeight||0, fps=Math.round(s.framesPerSecond||0);
          line=`${w}×${h}  ${fps} fps  ${kbps} kbps  direct\ncodec ${(s.codecId?'':'')}sent ${(bytes/1048576).toFixed(1)} MiB`;
        }
      });
      rep.forEach(s=>{ if(s.type==='candidate-pair'&&s.nominated&&s.currentRoundTripTime!=null) line+=`  rtt ${Math.round(s.currentRoundTripTime*1000)} ms`; });
    }catch{}
    if(line) elStats.textContent=line;
  },1000);
}
function stopStats(){ if(statsTimer){ clearInterval(statsTimer); statsTimer=null; } }

// ---- relay: the stream through the server when no direct path exists -----
// Some network pairs can never form a direct path (a carrier-grade NAT that
// picks a new port per destination facing a router that drops unexpected
// ports). Then this page encodes the screen itself with WebCodecs and sends
// each frame over a WebSocket that the rendezvous pairs with the host's. A
// fresh AES-256-GCM key travels inside the code-sealed answer, so the server
// forwards ciphertext it cannot read. Every message is
//   iv(12) | AES-GCM(type(1) | payload) | tag(16)
// with types 2 = control JSON and 3 = video, and the direction bound in as
// additional data. The path is TCP, so nothing is lost; only the rate matters:
// the bitrate follows this socket's send backlog and the host's decode backlog.
// Free-plan budget: about one message per frame, so the relay is capped at
// 15 fps (see README).
const relaySupported=()=>'VideoEncoder' in window && 'VideoFrame' in window && 'WebSocket' in window;
const AD_V2H=new TextEncoder().encode('OOI-relay/v1 v2h'), AD_H2V=new TextEncoder().encode('OOI-relay/v1 h2v');
const RELAY_FPS_MAX=15, FRAG=240*1024, RATE_MIN=150_000, RATE_MAX=4_000_000, RATE_START=1_200_000;
const timing={};             // measured fallback timings, for diagnostics
window.ooiTiming=timing;

function encoderConfig(name,w,h,bitrate,fps){
  const base={width:w,height:h,bitrate,framerate:fps,latencyMode:'realtime',bitrateMode:'variable'};
  if(name==='vp9') return {...base,codec:'vp09.00.41.08'};
  if(name==='vp8') return {...base,codec:'vp8'};
  if(name==='h264') return {...base,codec:'avc1.42E032',avc:{format:'annexb'}};
  if(name==='av1') return {...base,codec:'av01.0.08M.08'};
  return null;
}
// Keyframes of a 4K screen are huge and slow on a relayed path: cap at 1080p.
function fitSize(w,h){
  const s=Math.min(1,1920/w,1080/h);
  return {w:Math.max(2,Math.round(w*s/2)*2), h:Math.max(2,Math.round(h*s/2)*2)};
}

async function relayAttempt(id, code, room, gen, onLive){
  const t0=Date.now();
  watchStatus('Connecting through the relay…',"Your network can't reach your friend's computer directly, so the stream goes through the server, still end-to-end encrypted.",'wait');
  const raw=crypto.getRandomValues(new Uint8Array(32));
  let answer;
  try{ answer=await sealBlob(JSON.stringify({relay:1,key:b64u(raw)}),code); }catch{ return 'failed'; }
  let post;
  try{ post=await fetch(api(`/api/room/${id}/answer`),{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({answer,session:room.session})}); }catch{ return 'failed'; }
  if(post.status===409) return 'stale';
  if(!post.ok) return 'failed';
  if(gen!==generation) return 'aborted';
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);

  let done=deferred();
  const ws=new WebSocket(`${location.origin.replace(/^http/,'ws')}${MOUNT}/api/room/${id}/relay?session=${room.session}&role=viewer`);
  ws.binaryType='arraybuffer';
  const R={ws,closed:false,live:false,hello:null,enc:null,cfg:null,codec:'',fps:8,w:0,h:0,
    bitrate:RATE_START,cleanSince:Date.now(),lastChange:0,wantKey:true,pending:0,skipped:0,
    sent:0,frames:0,lastFrame:null,lastEncodeAt:0,rx:null,rtt:0,timers:[],reader:null,clone:null,canvas:null,ctx:null};
  window.ooiRelay=R;
  let sendChain=Promise.resolve(), recvChain=Promise.resolve();

  // Sealing is async; chain it so messages leave in order.
  const send=(type,payload)=>{
    if(ws.readyState!==1) return;
    R.pending+=payload.length;
    sendChain=sendChain.then(async()=>{
      const plain=new Uint8Array(payload.length+1); plain[0]=type; plain.set(payload,1);
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:AD_V2H},key,plain));
      R.pending-=payload.length;
      if(ws.readyState===1){ ws.send(cat(iv,ct)); R.sent+=ct.length+12; }
    }).catch(()=>{});
  };
  const ctl=o=>send(2,new TextEncoder().encode(JSON.stringify(o)));

  const onChunk=chunk=>{
    const data=new Uint8Array(chunk.byteLength); chunk.copyTo(data);
    const key=chunk.type==='key', ts=Math.floor(chunk.timestamp/1000)>>>0;
    for(let off=0;;off+=FRAG){
      const part=data.subarray(off,Math.min(off+FRAG,data.length)), more=off+FRAG<data.length;
      const m=new Uint8Array(9+part.length), dv=new DataView(m.buffer);
      m[0]=(key?1:0)|(more?2:0); dv.setUint32(1,ts); dv.setUint32(5,part.length); m.set(part,9);
      send(3,m);
      if(!more) break;
    }
    R.frames++;
  };

  const configure=()=>{ try{ R.enc.configure(R.cfg); }catch(e){ done.resolve(R.live?'dropped':'failed'); } };
  const setBitrate=b=>{
    R.bitrate=Math.round(Math.max(RATE_MIN,Math.min(RATE_MAX,b)));
    R.lastChange=Date.now(); R.cfg={...R.cfg,bitrate:R.bitrate}; configure();
  };
  // Step down ~25% quickly when either end falls behind; creep up after ten
  // clean seconds.
  const adapt=()=>{
    if(!R.cfg) return;
    const now=Date.now(), m=R.rx||{};
    const backlog=ws.bufferedAmount+R.pending;
    const congested=backlog>R.bitrate/8*0.25 || (m.q||0)>2 || (m.drop||0)>0 || R.skipped>R.fps/3;
    R.skipped=0;
    if(congested){
      R.cleanSince=now;
      if(now-R.lastChange>1500 && R.bitrate>RATE_MIN) setBitrate(R.bitrate*0.75);
    }else if(now-R.cleanSince>10000 && now-R.lastChange>10000 && R.bitrate<RATE_MAX){
      setBitrate(R.bitrate*1.15); R.cleanSince=now;
    }
  };

  const encode=f=>{
    if(R.closed || !R.enc || R.enc.state!=='configured') return;
    // Back-pressure: skip a frame while the socket or the encoder is behind,
    // and make the next one a keyframe only if the host asks.
    if(ws.bufferedAmount+R.pending>Math.max(128*1024,R.bitrate/8*0.5) || R.enc.encodeQueueSize>2){ R.skipped++; return; }
    const src=fitSize(f.displayWidth,f.displayHeight);
    if(src.w!==R.w || src.h!==R.h){            // the shared window was resized
      R.w=src.w; R.h=src.h; R.cfg={...R.cfg,width:R.w,height:R.h}; configure(); R.wantKey=true;
    }
    const ts=Math.round(performance.now()*1000);
    let vf;
    if(f.displayWidth===R.w && f.displayHeight===R.h) vf=new VideoFrame(f,{timestamp:ts});
    else{
      if(!R.canvas || R.canvas.width!==R.w || R.canvas.height!==R.h){ R.canvas=new OffscreenCanvas(R.w,R.h); R.ctx=R.canvas.getContext('2d'); }
      R.ctx.drawImage(f,0,0,R.w,R.h); vf=new VideoFrame(R.canvas,{timestamp:ts});
    }
    R.lastEncodeAt=performance.now();
    try{ R.enc.encode(vf,{keyFrame:R.wantKey}); R.wantKey=false; }catch{}
    vf.close();
  };
  // Keep the newest frame: a static screen produces none, and a keyframe the
  // host asks for must still be sent.
  const take=f=>{
    if(R.closed){ f.close(); return; }
    if(R.lastFrame) R.lastFrame.close();
    R.lastFrame=f;
    if(performance.now()-R.lastEncodeAt>=1000/R.fps-4) encode(f);
  };

  const startEncoder=async h=>{
    showPreview();
    const track=shareStream.getVideoTracks()[0], st=track.getSettings();
    R.fps=Math.min(Number(elFps.value)||8, h.maxFps||RELAY_FPS_MAX, RELAY_FPS_MAX);
    ({w:R.w,h:R.h}=fitSize(st.width||1920, st.height||1080));
    // The host's preference order, with AV1 last: it costs this side far more CPU.
    const names=(h.codecs||['vp9','vp8','h264']).filter(n=>n!=='av1').concat((h.codecs||[]).includes('av1')?['av1']:[]);
    for(const n of names){
      const cfg=encoderConfig(n,R.w,R.h,R.bitrate,R.fps);
      if(!cfg) continue;
      try{ if((await VideoEncoder.isConfigSupported(cfg)).supported){ R.codec=n; R.cfg=cfg; break; } }catch{}
    }
    if(!R.cfg) throw new Error('This browser cannot encode any video format your friend\'s OOI can show.');
    R.enc=new VideoEncoder({output:onChunk,error:()=>done.resolve(R.live?'dropped':'failed')});
    configure();
    ctl({t:'config',codec:R.codec});
    if('MediaStreamTrackProcessor' in window){
      // Frames straight from the capture, unthrottled even in a background tab.
      R.clone=track.clone();
      R.reader=new MediaStreamTrackProcessor({track:R.clone}).readable.getReader();
      (async()=>{
        for(;;){
          let r; try{ r=await R.reader.read(); }catch{ break; }
          if(r.done) break;
          take(r.value);
        }
      })();
    }else{
      R.timers.push(setInterval(()=>{
        if(elPreview.readyState>=2) try{ take(new VideoFrame(elPreview,{timestamp:Math.round(performance.now()*1000)})); }catch{}
      },1000/R.fps));
    }
    R.timers.push(setInterval(()=>{
      if(R.wantKey && R.lastFrame && performance.now()-R.lastEncodeAt>300) encode(R.lastFrame);
    },150));
  };

  const handle=async data=>{
    const buf=new Uint8Array(data);
    if(buf.length<29) return;
    let plain;
    try{ plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.subarray(0,12),additionalData:AD_H2V},key,buf.subarray(12))); }
    catch{ return; }
    if(R.closed || plain[0]!==2) return;
    let m; try{ m=JSON.parse(new TextDecoder().decode(plain.subarray(1))); }catch{ return; }
    if(m.t==='hello' && !R.hello){
      R.hello=m; timing.relayHello=Date.now()-t0;
      watchStatus('Connecting through the relay…','Starting the video…','wait');
      startEncoder(m).catch(e=>{ watchStatus('Cannot relay',e.message,'err'); done.resolve('failed'); });
    }else if(m.t==='keyframe'){ R.wantKey=true; }
    else if(m.t==='rx'){
      R.rx=m;
      if(m.ping) ctl({t:'pong',id:m.ping});
      if(m.dec>0 && !R.live){ timing.relayFirstFrame=Date.now()-t0; done.resolve('connected'); }
      adapt();
    }else if(m.t==='pong'){ R.rtt=Date.now()-m.id; }
    else if(m.t==='ping'){ ctl({t:'pong',id:m.id}); }
  };
  ws.onmessage=ev=>{ if(typeof ev.data!=='string') recvChain=recvChain.then(()=>handle(ev.data)); };
  ws.onclose=()=>done.resolve(R.live?'dropped':'failed');
  ws.onopen=()=>{
    // Say hi until the host answers: it may join the relay after us.
    ctl({t:'hi',v:1});
    R.timers.push(setInterval(()=>{ if(!R.hello) ctl({t:'hi',v:1}); },1000));
    R.timers.push(setInterval(()=>ctl({t:'ping',id:Date.now()}),2000));
  };

  const timer=setTimeout(()=>done.resolve('timeout'),ATTEMPT_TIMEOUT);
  const watch=setInterval(()=>{ if(gen!==generation) done.resolve('aborted'); },250);
  // The host may re-offer before it joins (it took our request as a knock on
  // a live session): move to the new offer instead of waiting out the timeout.
  R.timers.push(setInterval(async()=>{
    if(R.live) return;
    try{ const now=await getOffer(id); if(!now||now.session!==room.session) done.resolve('stale'); }catch{}
  },2000));
  let why=await done.promise;
  clearTimeout(timer);
  if(why!=='connected'){ clearInterval(watch); relayClose(R); return why; }

  R.live=true;
  ssSet('ooi.relay.'+code,'1');
  onLive();
  watchStatus('Sharing your screen · relayed','Your friend can see this now. You can minimise the tab.','ok');
  await requestWake();
  showPreview();
  let lastSent=R.sent, lastFrames=R.frames;
  R.timers.push(setInterval(()=>{
    const kbps=Math.round((R.sent-lastSent)*8/1000), fps=R.frames-lastFrames;
    lastSent=R.sent; lastFrames=R.frames;
    elStats.textContent=`${R.w}×${R.h}  ${fps} fps  ${kbps} kbps  ${R.codec.toUpperCase()}\nrelayed (end-to-end encrypted)  rtt ${R.rtt} ms  target ${Math.round(R.bitrate/1000)} kbps`+
      (R.rx?`\nyour friend: ${R.rx.fps||0} fps shown, backlog ${R.rx.q||0}`:'');
  },1000));
  done=deferred();
  ws.onclose=()=>done.resolve('dropped');
  why=await done.promise;
  clearInterval(watch);
  relayClose(R);
  return 'connected';
}

function relayClose(R){
  if(R.closed) return;
  R.closed=true;
  R.timers.forEach(clearInterval);
  try{ R.reader?.cancel(); }catch{}
  try{ R.clone?.stop(); }catch{}
  try{ R.lastFrame?.close(); }catch{}
  try{ R.enc && R.enc.state!=='closed' && R.enc.close(); }catch{}
  try{ R.ws.close(); }catch{}
}

// ---- helpers --------------------------------------------------------------
function gatherComplete(pc,ms){
  if(pc.iceGatheringState==='complete') return Promise.resolve();
  return new Promise(res=>{
    const t=setTimeout(fin,ms);
    function fin(){ clearTimeout(t); pc.removeEventListener('icegatheringstatechange',chk); res(); }
    function chk(){ if(pc.iceGatheringState==='complete') fin(); }
    pc.addEventListener('icegatheringstatechange',chk);
  });
}
function deferred(){ let r,s=false; const p=new Promise(x=>r=x); return {promise:p,resolve:v=>{if(!s){s=true;r(v)}}}; }
async function requestWake(){ try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch{} }
function releaseWake(){ try{ wakeLock?.release(); }catch{} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !wakeLock && !elWatch.hidden) requestWake(); });

// ---- boot -----------------------------------------------------------------
function boot(){
  if(typeof RTCPeerConnection==='undefined' || !navigator.mediaDevices?.getDisplayMedia){
    elCompat.hidden=false; elCompat.textContent='This browser cannot share a screen. Use desktop Chrome, Edge or Firefox.';
    elConnect.disabled=true; return;
  }
  if(typeof DecompressionStream==='undefined'){
    elCompat.hidden=false; elCompat.textContent='This browser is too old (no DecompressionStream). Please update it.';
    elConnect.disabled=true; return;
  }
  renderSaved();
  // Deep link: /ooi/#ABC-DEF (fragment is never sent to the server).
  const frag=normalizeCode(location.hash.slice(1));
  if(frag.length===6){
    elCode.value=prettyCode(frag); elConnect.disabled=false;
    if(findSaved(frag)) start(frag); // known code: reconnect straight away
  }
  elCode.focus();
}
boot();
</script>
